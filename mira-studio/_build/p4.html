var VIEWS = { '/':homePage, '/services':servicesPage, '/gallery':galleryPage, '/about':aboutPage, '/contact':contactPage };

function routeNow(){
  var raw = (location.hash||'').replace(/^#/,'').split('?')[0];
  raw = raw.replace(/\/+$/,'');
  return raw || '/';
}
function render(){
  var route = routeNow();

  killStrands(); killQr();
  if(pageCtx){ try{ pageCtx.revert(); }catch(e){} pageCtx = null; }
  PAGE.innerHTML = view ? view() : notFoundPage();
  document.title = TITLES[route] || 'Not found — Mira Studio (concept)';
  $$('.site-nav [data-route]').forEach(function(a){
    if(a.getAttribute('data-route') === route.slice(1)) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  currentRoute = route;
  bindPageBits(route);
  try{ PAGE.focus({preventScroll:true}); }catch(e){}
  requestAnimationFrame(function(){ try{ if(window.ScrollTrigger) ScrollTrigger.refresh(); }catch(e){} });
}
function animateCurrent(){
  if(!window.gsap || RM){ root.classList.remove('pre'); magnetics(); return; }

function transition(){
  var animated = CAN && currentRoute !== null;
  var fired = false;
  var finish = function(){
    if(fired) return;
    fired = true;
    render();
    if(window.__lenis){ try{ window.__lenis.scrollTo(0,{immediate:true}); }catch(e){ window.scrollTo(0,0); } }
    else window.scrollTo(0,0);
    if(animated && window.gsap){ gsap.fromTo(PAGE,{opacity:0,y:22},{opacity:1,y:0,duration:.6,ease:'power3.out',clearProps:'all'}); }

}

function safe(tw, ms){
  if(!tw) return tw;
  setTimeout(function(){
    try{
      if(tw.progress() === 0 && !tw.paused()){
        var trig = tw.scrollTrigger;
        if(!trig || (window.scrollY + window.innerHeight) > ((trig.start || 0) + 4)){
          tw.kill();
          gsap.set(tw.targets(), { clearProps:'all' });
        }
      }
    }catch(e){}
  }, ms || 4200);
  return tw;
}

function magnetics(){

    el.addEventListener('mousemove',function(ev){
      var r = el.getBoundingClientRect();
      xt((ev.clientX - r.left - r.width/2)*.22);
      yt((ev.clientY - r.top - r.height/2)*.3);
    });

/* ---------- strand canvas (hero) ---------- */
var strands = { raf:0, cleanup:null };
function killStrands(){
  if(strands.raf){ cancelAnimationFrame(strands.raf); strands.raf = 0; }
  if(strands.cleanup){ try{ strands.cleanup(); }catch(e){} strands.cleanup = null; }
  if(window.__ampSet) window.__ampSet = null;
}
function initStrands(){
  var canvas = $('#strands');
  if(!canvas || RM) return;
  var c2 = null; try{ c2 = canvas.getContext('2d'); }catch(e){}
  if(!c2) return;
  var host = canvas.parentElement;
  var W=1,H=1, DPR = Math.min(window.devicePixelRatio||1, 1.6);
  var arr = [], t=0, boost=0, targetBoost=0, visible = true;
  var mouse = {x:-9999,y:-9999,tx:-9999,ty:-9999};
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function build(){
    var n = window.innerWidth < 760 ? 30 : 62;
    arr = [];
    for(var i=0;i<n;i++){
      arr.push({ x:(i+.5)/n*W, off:rnd(-16,16), len:H*rnd(.55,1.02), lean:rnd(-.14,.14), sway:rnd(8,22), speed:rnd(.1,.3), phase:rnd(0,6.28), w:rnd(.5,1.3), rose:Math.random()<.15, a:rnd(.05,.11) });
    }
  }
  function size(){
    var r = host.getBoundingClientRect();
    W = Math.max(1,r.width); H = Math.max(1,r.height);
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    c2.setTransform(DPR,0,0,DPR,0,0);
    build();
  }
  function frame(){
    if(!strands.raf) return;
    strands.raf = requestAnimationFrame(frame);
    if(!visible || document.hidden) return;
    t += .016;
    boost += (targetBoost-boost)*.06; targetBoost *= .93;
    mouse.x += (mouse.tx-mouse.x)*.07; mouse.y += (mouse.ty-mouse.y)*.07;
    c2.clearRect(0,0,W,H);
    for(var i=0;i<arr.length;i++){
      var s = arr[i];
      c2.beginPath();
      for(var k=0;k<=5;k++){
        var p = k/5, y = p*s.len + 14;
        var x = s.x + s.off + s.lean*y + Math.sin(t*s.speed*2 + s.phase + p*3.2)*s.sway*(.35+p*.65) + boost*Math.sin(s.phase)*16;
        var dx = x-mouse.x, dy = y-mouse.y, d2 = dx*dx+dy*dy;
        if(d2 < 24000){ var f = 1 - d2/24000, dl = Math.sqrt(d2)||1; x += dx/dl*f*24; }
        if(k===0) c2.moveTo(x,y); else c2.lineTo(x,y);
      }
      c2.lineWidth = s.w; c2.lineCap = 'round';
      c2.strokeStyle = s.rose ? 'rgba(179,113,124,'+(s.a*1.35)+')' : 'rgba(43,33,24,'+s.a+')';
      c2.stroke();
    }
  }
  size();
  var onResize = function(){ size(); };
  window.addEventListener('resize', onResize);
  var io = null;
  try{ io = new IntersectionObserver(function(en){ visible = en[0].isIntersecting; },{threshold:0}); io.observe(host); }catch(e){}
  var onMove = function(e){
    var r = host.getBoundingClientRect();
    mouse.tx = e.clientX - r.left; mouse.ty = e.clientY - r.top;
  };
  document.addEventListener('mousemove', onMove);
  window.__ampSet = function(v){ targetBoost = Math.min(2.2, v); };
  strands.raf = requestAnimationFrame(frame);
  strands.cleanup = function(){
    window.removeEventListener('resize', onResize);
    document.removeEventListener('mousemove', onMove);
    if(io) io.disconnect();
    window.__ampSet = null;
  };
}

/* ---------- strand-QR canvas (booking section signature) ---------- */
var qr = { raf:0, cleanup:null };
function killQr(){
  if(qr.raf){ cancelAnimationFrame(qr.raf); qr.raf = 0; }
  if(qr.cleanup){ try{ qr.cleanup(); }catch(e){} qr.cleanup = null; }
}
function initQr(){
  var panel = $('#qrPanel'), canvas = $('#qrCanvas'), stat = $('#qrStatic'), tog = $('#qrToggle');
  if(!panel || !canvas || !stat) return;
  var small = false; try{ small = window.matchMedia('(max-width:760px)').matches; }catch(e){}
  var c2 = null; try{ c2 = canvas.getContext('2d'); }catch(e){}
  if(RM || small || !c2 || !QR || !QR.m || !QR.m.length){
    /* Static path: the SVG shows straight away (CSS fade-in). No toggle. */
    if(tog) tog.style.display = 'none';
    return;
  }
  panel.classList.add('qr-live');
  var n = QR.m.length, B = 4, N2 = n + B*2;
  var W = 1, DPR = Math.min(window.devicePixelRatio||1, 1.6);
  var prog = 0, progT = 0, settled = false, visible = false, started = false;
  var t = 0, strandsArr = [];
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function build(){
    var targets = [];
    for(var r=0;r<n;r++){
      var row = QR.m[r];
      for(var c=0;c<n;c++){
        if(row.charAt(c) === '1'){
          targets.push({x:(c+B+rnd(.18,.82))/N2, y:(r+B+rnd(.18,.82))/N2});
          targets.push({x:(c+B+rnd(.18,.82))/N2, y:(r+B+rnd(.18,.82))/N2});
        }
      }
    }
    var S = Math.max(24, Math.round(targets.length / 34)); /* ~34 strands */
    strandsArr = [];
    var per = Math.ceil(targets.length / S);
    for(var i=0;i<S;i++){
      var pts = [];
      for(var k=0;k<per;k++){
        var idx = i*per + k;
        if(idx >= targets.length) break;
        pts.push({ tx:targets[idx].x, ty:targets[idx].y, jx:rnd(-.05,.05), jy:rnd(-.05,.05) });
      }
      if(pts.length < 2) continue;
      strandsArr.push({ x0:(i+.5)/S, pts:pts, sway:rnd(.02,.05), speed:rnd(.4,.9), phase:rnd(0,6.28), rose:Math.random()<.12, a:rnd(.5,.8) });
    }
  }
  function size(){
    var r = panel.getBoundingClientRect();
    W = Math.max(1, r.width);
    canvas.width = W*DPR; canvas.height = W*DPR;
    canvas.style.width = W+'px'; canvas.style.height = W+'px';
    c2.setTransform(DPR,0,0,DPR,0,0);
    build();
  }
  function ease(p){ return p<.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2; }
  function frame(){
    if(!qr.raf) return;
    qr.raf = requestAnimationFrame(frame);
    if(!visible || document.hidden) return;
    t += .016;
    if(Math.abs(progT - prog) > .001){ prog += (progT - prog) * .045; }
    else { prog = progT; }
    if(progT === 1 && !settled && prog > .995){ settled = true; panel.classList.add('is-on'); }
    if(progT === 0 && settled && prog < .02){ settled = false; panel.classList.remove('is-on'); }
    c2.clearRect(0,0,W,W);
    var e = ease(Math.max(0, Math.min(1, prog)));
    if(prog > .55){
      var a = Math.min(1, (prog - .55) / .45);
      var cell = W / N2;
      c2.fillStyle = 'rgba(43,33,24,' + (a * .92) + ')';
      for(var r=0;r<n;r++){
        var row = QR.m[r];
        for(var c=0;c<n;c++){
          if(row.charAt(c) === '1'){
            var x = (c+B)*cell, y = (r+B)*cell;
            var pad = cell*.10;
            c2.fillRect(x+pad, y+pad, cell-pad*2, cell-pad*2);
          }
        }
      }
    }
    for(var i=0;i<strandsArr.length;i++){
      var s = strandsArr[i];
      c2.beginPath();
      for(var k=0;k<s.pts.length;k++){
        var p = s.pts[k];
        var dX = (s.x0 + Math.sin(t*s.speed + s.phase + k*.35) * s.sway) * W;
        var dY = (k / s.pts.length) * W * .96 + W * .02;
        var tX = (p.tx + p.jx) * W, tY = (p.ty + p.jy) * W;
        var x = dX + (tX - dX) * e;
        var y = dY + (tY - dY) * e;
        if(k===0) c2.moveTo(x,y); else c2.lineTo(x,y);
      }
      c2.lineWidth = .9; c2.lineCap = 'round';
      c2.strokeStyle = s.rose ? 'rgba(179,113,124,' + (s.a*.8) + ')' : 'rgba(43,33,24,' + s.a + ')';
      c2.stroke();
    }
  }
  function setTogLabel(){ if(tog) tog.textContent = progT ? 'Scatter again' : 'Gather again'; }
  function toggle(){ progT = progT ? 0 : 1; setTogLabel(); }
  panel.addEventListener('click', function(e){ if(e.target === stat || e.target === canvas || e.target === panel) toggle(); });
  if(tog) tog.addEventListener('click', toggle);
  size();
  var onResize = function(){ size(); };
  window.addEventListener('resize', onResize);
  var io = null;
  function startGather(){
    started = true;
    var sm = false; try{ sm = window.matchMedia('(max-width:760px)').matches || window.innerWidth <= 760; }catch(e){}
    if(sm){ settled = true; panel.classList.add('is-on'); if(tog) tog.style.display = 'none'; return; }
    progT = 1; setTogLabel();
  }
  try{
    io = new IntersectionObserver(function(en){
      visible = en[0].isIntersecting;
      if(visible && !started){ startGather(); }
    },{threshold:.35});
    io.observe(panel);
  }catch(e){ visible = true; startGather(); }
  qr.raf = requestAnimationFrame(frame);
  qr.cleanup = function(){
    window.removeEventListener('resize', onResize);
    if(io) io.disconnect();
    panel.classList.remove('qr-live','is-on');
  };
}

    box.innerHTML = '<p class="find-h" tabindex="-1">'+esc(w.q)+'</p>'
      + '<div class="fchips" role="group" aria-label="'+esc(w.q)+'">'
      + w.opts.map(function(o,i){ return '<button class="fchip" type="button" data-find-goal="'+i+'">'+esc(o.label)+'</button>'; }).join('')
      + '</div><button class="tlink" type="button" data-find-reset>← Start over</button>';
  } else {
    var opt = FIND[findState.want].opts[findState.goal];
    var s = svcById(opt.svc);
    box.innerHTML = '<div class="find-result">'
      + '<span class="chip" style="align-self:flex-start">Suggested · sample</span>'
      + '<h3 tabindex="-1">'+esc(s.name)+'</h3>'
      + '<p class="fr-why">'+esc(opt.why)+'</p>'
      + '<div class="svc-meta"><span><span class="k">Duration</span><span class="v">'+s.dur+' min</span></span>'
      + '<span class="svc-price"><span class="k">From · sample</span><span class="v">'+money(s.price)+'</span></span></div>'
      + '<div class="hero-actions" style="margin-top:18px">'
      + '<button class="btn" type="button" data-enquire="'+s.id+'" data-magnetic>Continue with this <span class="a" aria-hidden="true">↗</span></button>'
      + '<button class="tlink" type="button" data-find-reset>Start over</button>'
      + '</div></div>';
  }
  if(focus !== false){
    var f = box.querySelector('.find-h, .find-result h3');
    if(f) try{ f.focus({preventScroll:false}); }catch(e){}
  }
}

/* ---------- booking demo (stepped) ---------- */
var book = { step:1, svc:'cut-shape', day:null, time:null, name:'', mail:'', note:'' };
function bShow(n, focus){
  var form = $('#enqForm'); if(!form) return;
  book.step = n;
  $$('.bstep', form).forEach(function(p){ p.hidden = (+p.getAttribute('data-bpanel') !== n); });
  var done = $('#bDone'); if(done) done.hidden = true;
  $$('#bSteps li').forEach(function(li){
    if(+li.getAttribute('data-bind') === n) li.setAttribute('aria-current','step');
    else li.removeAttribute('aria-current');
  });
  if(n === 4) paintReview();
  if(focus !== false){
    var panel = $('.bstep[data-bpanel="'+n+'"]', form);
    var h = panel && panel.querySelector('.bstep-h');
    if(h) try{ h.focus({preventScroll:false}); }catch(e){}
  }
}
function bDoneShow(){
  var form = $('#enqForm'); if(!form) return;
  $$('.bstep', form).forEach(function(p){ p.hidden = true; });
  var done = $('#bDone');
  if(done){ done.hidden = false; var h = done.querySelector('.bstep-h'); if(h) try{ h.focus({preventScroll:false}); }catch(e){} }
  $$('#bSteps li').forEach(function(li){ li.removeAttribute('aria-current'); });
}
function renderSlots(){
  var dd = $('#slotDays'), tt = $('#slotTimes');
  if(dd){
    dd.innerHTML = openDays().map(function(d){
      var iso = d.toISOString().slice(0,10);
      return '<button class="slot" type="button" data-day="'+iso+'" aria-pressed="'+(book.day===iso)+'">'+dayLabel(iso)+'</button>';
    }).join('');
  }
  if(tt){
    tt.innerHTML = SLOT_TIMES.map(function(tm){
      return '<button class="slot" type="button" data-time="'+tm+'" aria-pressed="'+(book.time===tm)+'">'+tm+'</button>';
    }).join('');
  }
}
function paintReview(){
  var box = $('#bReview'); if(!box) return;
  var s = svcById(book.svc);
  box.innerHTML = '<div class="slip">'
    + '<div class="slip-head"><h3>Your demo, reviewed</h3><span class="slip-stamp">Demo · not sent</span></div>'
    + '<div class="srow"><span class="k">Service</span><span class="v">'+esc(s.name)+' · '+s.dur+' min · '+money(s.price)+' sample</span></div>'
    + '<div class="srow"><span class="k">Sample slot</span><span class="v">'+(book.day ? esc(dayLabel(book.day)) : '[pick a day]')+(book.time ? ' · '+esc(book.time) : '')+' · sample</span></div>'
    + '<div class="srow"><span class="k">Name</span><span class="v">'+esc(book.name || '[your name]')+'</span></div>'
    + '<div class="srow"><span class="k">Email</span><span class="v">'+esc(book.mail || '[your email]')+'</span></div>'
    + (book.note ? '<div class="srow"><span class="k">Note</span><span class="v">'+esc(book.note)+'</span></div>' : '')
    + '<p class="slip-note">Prepared in this browser only — nothing was stored or sent, and no slot is reserved. A real studio would confirm availability with you.</p>'
    + '</div>';
}
function onBookingSubmit(e){
  e.preventDefault();
  var top = $('#fTop');
  if(book.step === 1){ bShow(2); return; }
  if(book.step === 2){
    var err = '';
    if(!book.day || !book.time) err = 'Pick a sample day and time to continue.';
    var ep = $('[data-err="bSlot"]'); if(ep) ep.textContent = err;
    if(err){ if(top) top.textContent = 'Please review the highlighted choice — nothing has been sent.'; return; }
    if(top) top.textContent = '';
    bShow(3); return;
  }
  if(book.step === 3){
    var errs = {};
    if(!book.name.trim()) errs.fName = 'Please add a name for the preview.';
    if(!book.mail.trim()) errs.fMail = 'Add an email so the preview shows a reply-to.';
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(book.mail.trim())) errs.fMail = 'That email looks off — mind checking it?';
    ['fName','fMail'].forEach(function(id){
      var el = $('#'+id), p = $('[data-err="'+id+'"]');
      var msg = errs[id] || '';
      if(el) el.setAttribute('aria-invalid', msg ? 'true' : 'false');
      if(p) p.textContent = msg;
    });
    var firstBad = $('#enqForm [aria-invalid="true"]');
    if(firstBad){ if(top) top.textContent = 'Please review the highlighted fields — nothing has been sent.'; firstBad.focus(); return; }
    if(top) top.textContent = '';
    bShow(4); return;
  }
  if(book.step === 4){ bDoneShow(); return; }
}
function initBooking(){
  book = { step:1, svc: selectedService || 'cut-shape', day:null, time:null, name:'', mail:'', note:'' };
  var sel = $('#fSvc');
  if(sel){ sel.value = book.svc; sel.addEventListener('change', function(){ book.svc = sel.value; }); }
  ['fName','fMail','fNote'].forEach(function(id){
    var el = $('#'+id);
    if(el) el.addEventListener('input', function(){
      if(id === 'fName') book.name = el.value;
      else if(id === 'fMail') book.mail = el.value;
      else book.note = el.value;
    });
  });
  var form = $('#enqForm');
  if(form) form.addEventListener('submit', onBookingSubmit);
  var sample = $('#bSample');
  if(sample) sample.addEventListener('click', function(){
    var nm = $('#fName'), ml = $('#fMail'), nt = $('#fNote');
    if(nm){ nm.value = 'Sample Guest'; book.name = nm.value; }
    if(ml){ ml.value = 'guest@example.com'; book.mail = ml.value; }
    if(nt){ nt.value = 'Testing the demo flow.'; book.note = nt.value; }
  });
  var again = $('#bAgain');
  if(again) again.addEventListener('click', function(){ initBooking(); });
  var w1 = $('#waBtn'); if(w1) w1.addEventListener('click', waPreview);
  var w2 = $('#waBtn2'); if(w2) w2.addEventListener('click', waPreview);
  renderSlots();
  bShow(1, false);
}
function waPreview(){
  var s = svcById(book.svc);
  var name = book.name.trim() || '[your name]';
  var when = (book.day ? dayLabel(book.day) : '[preferred day]') + (book.time ? ' at ' + book.time : '');
  var text = 'Hello Mira Studio, I’d like to ask about ' + s.name + ' (' + s.dur + ' min · sample ' + money(s.price) + ') on ' + when + '.\n\nName: ' + name + '\n\n[Preview only — no message is sent.]';
  var pv = $('#waPreview'); if(pv) pv.textContent = text;
  openDialog($('#waDialog'));
}

/* ---------- filters ---------- */
var fState = { cat:'All', dur:180, sort:'featured' };
function initFilters(){
  var chips = $$('#fChips .fchip');
  chips.forEach(function(c){
    c.addEventListener('click', function(){
      fState.cat = c.getAttribute('data-cat');
      chips.forEach(function(x){ x.setAttribute('aria-pressed', String(x === c)); });
      updateResults(true);
    });
  });
  var range = $('#fDur');
  if(range) range.addEventListener('input', function(ev){ fState.dur = +ev.target.value; var o=$('#fDurOut'); if(o) o.textContent = fState.dur + ' min'; updateResults(false); });
  var sort = $('#fSort');
  if(sort) sort.addEventListener('change', function(ev){ fState.sort = ev.target.value; updateResults(true); });
  updateResults(false, true);
}
function updateResults(animate, first){
  var list = DATA.services.filter(function(s){
    return (fState.cat === 'All' || s.cat === fState.cat) && s.dur <= fState.dur;
  });
  if(fState.sort === 'price') list = list.slice().sort(function(a,b){ return a.price-b.price; });
  if(fState.sort === 'dur') list = list.slice().sort(function(a,b){ return a.dur-b.dur; });
  var count = $('#fCount');
  if(count) count.innerHTML = '<strong>'+list.length+'</strong> of '+DATA.services.length+' sample services shown · prices are illustrative';
  var grid = $('#svcResults');
  if(!grid) return;
  if(!list.length){ grid.innerHTML = '<p class="fempty">No sample services match those filters. Try a longer duration or another category.</p>'; return; }
  grid.innerHTML = list.map(svcCard).join('');
  if(CAN && animate && window.gsap){
    gsap.from(grid.children,{opacity:0,y:12,duration:.4,stagger:.05,ease:'power2.out',clearProps:'all'});
  }
}

/* ---------- scroll plumbing ---------- */
function onScrollTick(y, progress){
  if(progressEl) progressEl.style.transform = 'scaleX(' + (progress||0) + ')';
  if(header) header.classList.toggle('is-scrolled', y > 12);
  var show = y > 520 && currentRoute !== '/contact' && currentRoute !== null;
  if(mCta) mCta.classList.toggle('is-shown', !!show);
}
function toggleDrawer(){
  var d = $('#navDrawer'), b = $('#menuToggle');
  if(!d || !b) return;
  var open = !d.classList.contains('is-open');
  d.classList.toggle('is-open', open);
  b.setAttribute('aria-expanded', String(open));
  b.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  try{ if(window.__lenis){ open ? window.__lenis.stop() : window.__lenis.start(); } }catch(e){}
  if(open){
    setTimeout(function(){
      var f = d.querySelector('a.dl') || d.querySelector('.drawer-close');
      if(f) try{ f.focus(); }catch(e){}
    }, 80);
  }
}
function closeDrawer(){
  var d = $('#navDrawer'); if(!d) return;
  if(!d.classList.contains('is-open')) return;
  var hadFocus = false;
  try{ hadFocus = d.contains(document.activeElement); }catch(e){}
  d.classList.remove('is-open');
  var b = $('#menuToggle');
  if(b){
    b.setAttribute('aria-expanded','false'); b.setAttribute('aria-label','Open menu');
    if(hadFocus) try{ b.focus(); }catch(e){}
  }
  try{ if(window.__lenis) window.__lenis.start(); }catch(e){}
}

/* ---------- global listeners ---------- */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  var nav = t.closest('a[data-nav]');
  if(nav){
    var href = nav.getAttribute('href') || '';
    if(href.indexOf('#/') === 0){
      e.preventDefault();
      closeDrawer();
      if(location.hash === href){ transition(); } else { location.hash = href; }
    }
    return;
  }
  var sc = t.closest('[data-scroll]');
  if(sc){
    e.preventDefault();
    var id = (sc.getAttribute('href')||'').replace('#','');
    var el = id ? document.getElementById(id) : null;
    if(el) try{ el.scrollIntoView({behavior: RM ? 'auto' : 'smooth', block:'start'}); }catch(e2){}
    return;
  }
  if(t.closest('#menuToggle')){ toggleDrawer(); return; }
  if(t.id === 'navDrawer'){ closeDrawer(); return; }
  if(t.closest('.drawer-close')){ closeDrawer(); return; }
  var enq = t.closest('[data-enquire]');
  if(enq){
    selectedService = enq.getAttribute('data-enquire');
    if(location.hash === '#/contact'){ render(); animateCurrent(); } else { location.hash = '#/contact'; }
    return;
  }
  var gal = t.closest('[data-gal]');
  if(gal){ openLightbox(gal.getAttribute('data-gal')); return; }
  var close = t.closest('[data-close]');
  if(close){ closeDialog(close.closest('dialog')); return; }
  /* finder */
  var fw = t.closest('[data-find-want]');
  if(fw){ findState.want = fw.getAttribute('data-find-want'); findState.goal = null; renderFind(true); return; }
  var fg = t.closest('[data-find-goal]');
  if(fg){ findState.goal = +fg.getAttribute('data-find-goal'); renderFind(true); return; }
  if(t.closest('[data-find-reset]')){ findState = { want:null, goal:null }; renderFind(true); return; }
  /* booking steps + slots */
  var bk = t.closest('[data-bback]');
  if(bk){ bShow(+bk.getAttribute('data-bback')); return; }
  if(t.closest('[data-bcancel]')){ var top = $('#fTop'); if(top) top.textContent = ''; initBooking(); return; }
  var sd = t.closest('[data-day]');
  if(sd){ book.day = sd.getAttribute('data-day'); renderSlots(); var ep1 = $('[data-err="bSlot"]'); if(ep1) ep1.textContent = ''; return; }
  var st = t.closest('[data-time]');
  if(st){ book.time = st.getAttribute('data-time'); renderSlots(); var ep2 = $('[data-err="bSlot"]'); if(ep2) ep2.textContent = ''; return; }
});
document.addEventListener('keydown', function(e){
  var d = $('#navDrawer');
  if(d && d.classList.contains('is-open')){
    if(e.key === 'Escape'){ closeDrawer(); return; }
    if(e.key === 'Tab'){
      var items = $$('#navDrawer a, #navDrawer button').filter(function(el){ return el.offsetParent !== null; });
      if(!items.length) return;
      var first = items[0], last = items[items.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
      return;
    }
  }
  if(e.key === 'Escape'){ closeDrawer(); return; }
  var lb = $('#lightbox');
  if(lb && lb.open){
    if(e.key === 'ArrowRight'){ lbIndex = (lbIndex+1) % DATA.photos.length; paintLightbox(); }
    if(e.key === 'ArrowLeft'){ lbIndex = (lbIndex+DATA.photos.length-1) % DATA.photos.length; paintLightbox(); }
  }
});
document.addEventListener('mousemove', function(e){
  if(!CAN) return;
  var fine = true; try{ fine = window.matchMedia('(pointer:fine)').matches; }catch(e2){}
  if(!fine) return;
  var svc = e.target && e.target.closest ? e.target.closest('.svc') : null;
  if(svc){
    var r = svc.getBoundingClientRect();
    svc.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
    svc.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  }
  var stage = $('#heroStage');
  var wrap = $('#heroCardWrap');
  if(stage && wrap && window.gsap){
    var sr = stage.getBoundingClientRect();
    var dx = (e.clientX - sr.left) / sr.width - .5;
    var dy = (e.clientY - sr.top) / sr.height - .5;
    var inside = e.clientX >= sr.left && e.clientX <= sr.right && e.clientY >= sr.top && e.clientY <= sr.bottom;
    if(!wrap._ry){ wrap._ry = gsap.quickTo(wrap,'rotationY',{duration:.7,ease:'power3'}); wrap._rx = gsap.quickTo(wrap,'rotationX',{duration:.7,ease:'power3'}); }
    if(inside){ wrap._ry(dx*7); wrap._rx(-dy*5.5); }
    else if(wrap._inside){ wrap._ry(0); wrap._rx(0); }
    wrap._inside = inside;
  }
});
$$('dialog').forEach(function(dlg){
  dlg.addEventListener('click', function(e){ if(e.target === dlg) closeDialog(dlg); });
  dlg.addEventListener('close', function(){ try{ if(window.gsap) gsap.set(dlg,{clearProps:'all'}); }catch(e2){} dlg._closing = false; });
});
window.addEventListener('hashchange', transferGuard);
function transferGuard(){ transition(); }

/* ---------- boot ---------- */
function finishLibs(ok){
  CAN = ok && !RM;
  if(ok){
    try{ gsap.registerPlugin(ScrollTrigger); }catch(e){}
    if(window.Lenis && !RM){
      try{
        var lenis = new Lenis({ duration:1.15, smoothWheel:true });
        window.__lenis = lenis;
        lenis.on('scroll', function(inst){
          onScrollTick(inst.scroll || 0, inst.progress || 0);
          if(window.__ampSet) window.__ampSet(Math.abs(inst.velocity || 0) * .5);
          try{ ScrollTrigger.update(); }catch(e2){}
        });
        gsap.ticker.add(function(t){ lenis.raf(t * 1000); });
        gsap.ticker.lagSmoothing(0);
      }catch(e){ window.__lenis = null; }
    }
    if(!window.__lenis){
      window.addEventListener('scroll', function(){
        var y = window.scrollY || window.pageYOffset || 0;
        var h = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        onScrollTick(y, y / h);
      }, { passive:true });
    }
  }
  animateCurrent();
}
function fillFooterHours(){
  var fh = document.getElementById('footerHours');
  if(fh) fh.innerHTML = hoursShort() + '<br>Mondays closed<br><b>Sample hours only</b>';
}
function boot(){
  setTimeout(function(){ if(root.classList.contains('pre')) root.classList.remove('pre'); }, 2600);
  fillFooterHours();
  render();
  var waited = 0;
  (function check(){
    var ok = !!(window.gsap && window.ScrollTrigger);
    if(ok){ finishLibs(true); return; }
    if(waited > 2400){ finishLibs(false); return; }
    waited += 120;
    setTimeout(check, 120);
  })();
}
if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); }
else { boot(); }

})();
</script>
