function routeNow(){

    if(window.__lenis){ try{ window.__lenis.scrollTo(0,{immediate:true}); }catch(e){ window.scrollTo(0,0); } }
    else window.scrollTo(0,0);

  setTimeout(function(){

        if(!trig || (window.scrollY + window.innerHeight) > ((trig.start || 0) + 4)){

      }
    }catch(e){}

  return tw;
}

/* ---------- strand canvas ---------- */
var strands = { raf:0, cleanup:null };
function killStrands(){
  if(strands.raf){ cancelAnimationFrame(strands.raf); strands.raf = 0; }
  if(strands.cleanup){ try{ strands.cleanup(); }catch(e){} strands.cleanup = null; }
  if(window.__ampSet) window.__ampSet = null;
}
function initStrands(){
  var canvas = $('#strands');
  if(!canvas || RM) return;
  var c2 = null; try{ c2 = canvas.getContext('2d'); }catch(e){}
  if(!c2) return;
  var host = canvas.parentElement;
  var W=1,H=1, DPR = Math.min(window.devicePixelRatio||1, 1.6);
  var arr = [], t=0, boost=0, targetBoost=0, visible = true;
  var mouse = {x:-9999,y:-9999,tx:-9999,ty:-9999};
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function build(){
    var n = window.innerWidth < 760 ? 30 : 62;
    arr = [];
    for(var i=0;i<n;i++){
      arr.push({ x:(i+.5)/n*W, off:rnd(-16,16), len:H*rnd(.55,1.02), lean:rnd(-.14,.14), sway:rnd(8,22), speed:rnd(.1,.3), phase:rnd(0,6.28), w:rnd(.5,1.3), rose:Math.random()<.15, a:rnd(.05,.11) });
    }
  }
  function size(){
    var r = host.getBoundingClientRect();
    W = Math.max(1,r.width); H = Math.max(1,r.height);
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    c2.setTransform(DPR,0,0,DPR,0,0);
    build();
  }
  function frame(){
    if(!strands.raf) return;
    strands.raf = requestAnimationFrame(frame);
    if(!visible || document.hidden) return;
    t += .016;
    boost += (targetBoost-boost)*.06; targetBoost *= .93;
    mouse.x += (mouse.tx-mouse.x)*.07; mouse.y += (mouse.ty-mouse.y)*.07;
    c2.clearRect(0,0,W,H);
    for(var i=0;i<arr.length;i++){
      var s = arr[i];
      c2.beginPath();
      for(var k=0;k<=5;k++){
        var p = k/5, y = p*s.len + 14;
        var x = s.x + s.off + s.lean*y + Math.sin(t*s.speed*2 + s.phase + p*3.2)*s.sway*(.35+p*.65) + boost*Math.sin(s.phase)*16;
        var dx = x-mouse.x, dy = y-mouse.y, d2 = dx*dx+dy*dy;
        if(d2 < 24000){ var f = 1 - d2/24000, dl = Math.sqrt(d2)||1; x += dx/dl*f*24; }
        if(k===0) c2.moveTo(x,y); else c2.lineTo(x,y);
      }
      c2.lineWidth = s.w; c2.lineCap = 'round';
      c2.strokeStyle = s.rose ? 'rgba(179,113,124,'+(s.a*1.35)+')' : 'rgba(43,33,24,'+s.a+')';
      c2.stroke();
    }
  }
  size();
  var onResize = function(){ size(); };
  window.addEventListener('resize', onResize);
  var io = null;
  try{ io = new IntersectionObserver(function(en){ visible = en[0].isIntersecting; },{threshold:0}); io.observe(host); }catch(e){}
  var onMove = function(e){
    var r = host.getBoundingClientRect();
    mouse.tx = e.clientX - r.left; mouse.ty = e.clientY - r.top;
  };
  document.addEventListener('mousemove', onMove);
  window.__ampSet = function(v){ targetBoost = Math.min(2.2, v); };
  strands.raf = requestAnimationFrame(frame);
  strands.cleanup = function(){
    window.removeEventListener('resize', onResize);
    document.removeEventListener('mousemove', onMove);
    if(io) io.disconnect();
    window.__ampSet = null;
  };
}

    if(window.Lenis && !RM){
      try{
        var lenis = new Lenis({ duration:1.15, smoothWheel:true });
        window.__lenis = lenis;
        lenis.on('scroll', function(inst){
          onScrollTick(inst.scroll || 0, inst.progress || 0);
          if(window.__ampSet) window.__ampSet(Math.abs(inst.velocity || 0) * .5);
          try{ ScrollTrigger.update(); }catch(e2){}
        });
        gsap.ticker.add(function(t){ lenis.raf(t * 1000); });
        gsap.ticker.lagSmoothing(0);
      }catch(e){ window.__lenis = null; }
    }
    if(!window.__lenis){
      window.addEventListener('scroll', function(){
        var y = window.scrollY || window.pageYOffset || 0;
        var h = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        onScrollTick(y, y / h);
      }, { passive:true });
    }
  }
  animateCurrent();
}
function boot(){
  setTimeout(function(){ if(root.classList.contains('pre')) root.classList.remove('pre'); }, 2600);
  render();
  var waited = 0;
  (function check(){
    var ok = !!(window.gsap && window.ScrollTrigger);
    if(ok){ finishLibs(true); return; }
    if(waited > 2400){ finishLibs(false); return; }
    waited += 120;
    setTimeout(check, 120);
  })();
}
if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); }
else { boot(); }

})();
</script>
